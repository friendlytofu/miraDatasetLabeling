<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · Mira Dataset Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14201D;
    --ink-soft: #4B5750;
    --muted: #7C8880;
    --card: #FFFFFF;
    --border: #CBD3CE;
    --teal: #1E7A6E;
    --teal-deep: #123F39;
    --teal-tint: #E1EFEC;
    --red: #A13D2B;
    --red-tint: #F6E2DC;
    --font-display: "Newsreader", Georgia, serif;
    --font-body: "IBM Plex Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    font-family: var(--font-body);
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 10%, rgba(30,122,110,0.16), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(201,122,43,0.14), transparent 45%),
      linear-gradient(180deg, #0F1B18 0%, #14201D 100%);
  }
  .panel {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border-radius: 14px;
    padding: 2.25rem 2rem 2rem;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.06) inset;
    animation: rise 0.45s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .panel { animation: none; } }

  .mark {
    width: 42px; height: 42px; border-radius: 10px;
    background: linear-gradient(145deg, var(--teal), var(--teal-deep));
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 1.1rem;
    box-shadow: 0 6px 16px -6px rgba(30,122,110,0.6);
  }
  .mark svg { width: 22px; height: 22px; color: #EAF3F1; }

  h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.45rem; margin: 0 0 0.3rem; }
  .sub { color: var(--muted); font-size: 0.88rem; margin: 0 0 1.6rem; line-height: 1.5; }

  label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 0.4rem; }
  .pw-row { position: relative; }
  input[type="password"], input[type="text"] {
    width: 100%;
    font-family: var(--font-body);
    font-size: 0.98rem;
    padding: 0.7rem 2.6rem 0.7rem 0.85rem;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: #FBFBFA;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 3px var(--teal-tint);
  }
  .toggle-pw {
    position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 0.75rem; font-weight: 600; padding: 0.2rem 0.35rem;
  }
  .toggle-pw:hover { color: var(--ink-soft); }

  button.submit {
    width: 100%;
    margin-top: 1.25rem;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.95rem;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    border: none;
    background: linear-gradient(145deg, var(--teal), var(--teal-deep));
    color: #F3F5F2;
    cursor: pointer;
    box-shadow: 0 10px 22px -10px rgba(30,122,110,0.65);
    transition: transform 0.1s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  button.submit:hover { box-shadow: 0 14px 26px -10px rgba(30,122,110,0.75); }
  button.submit:active { transform: translateY(1px) scale(0.99); }
  button.submit:disabled { opacity: 0.6; cursor: default; }

  .error {
    display: none;
    margin-top: 0.9rem;
    font-size: 0.85rem;
    color: var(--red);
    background: var(--red-tint);
    border: 1px solid rgba(161,61,43,0.25);
    border-radius: 8px;
    padding: 0.55rem 0.75rem;
  }
  .error.is-visible { display: block; animation: shake 0.32s ease; }
  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }

  .footnote { margin-top: 1.5rem; font-size: 0.75rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <form class="panel" id="login-form" autocomplete="off">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 24" fill="none">
        <path d="M0 12 L10 12 L14 4 L20 20 L26 8 L30 16 L34 12 L64 12" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Mira Dataset Studio</h1>
    <p class="sub">This is an internal labeling tool. Enter the access password to continue.</p>

    <label for="password">Password</label>
    <div class="pw-row">
      <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" autofocus required />
      <button type="button" class="toggle-pw" id="toggle-pw">Show</button>
    </div>

    <button type="submit" class="submit" id="submit-btn">Continue</button>
    <p class="error" id="error-msg">Incorrect password — please try again.</p>
    <p class="footnote">Access is restricted to authorized labelers.</p>
  </form>

<script>
  const form = document.getElementById("login-form");
  const pwInput = document.getElementById("password");
  const toggleBtn = document.getElementById("toggle-pw");
  const errorMsg = document.getElementById("error-msg");
  const submitBtn = document.getElementById("submit-btn");

  toggleBtn.addEventListener("click", () => {
    const showing = pwInput.type === "text";
    pwInput.type = showing ? "password" : "text";
    toggleBtn.textContent = showing ? "Show" : "Hide";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMsg.classList.remove("is-visible");
    submitBtn.disabled = true;
    submitBtn.textContent = "Checking…";
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ password: pwInput.value }),
      });
      if (res.ok) {
        const params = new URLSearchParams(window.location.search);
        const next = params.get("next") || "/";
        window.location.href = next;
        return;
      }
      throw new Error("bad password");
    } catch {
      errorMsg.classList.add("is-visible");
      pwInput.value = "";
      pwInput.focus();
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Continue";
    }
  });
</script>
</body>
</html>
