<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · Mira Dataset Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12181C;
    --ink-soft: #4A555C;
    --muted: #8A939A;
    --card: #FFFFFF;
    --line: #DEE3DF;
    --teal: #0E8C79;
    --teal-deep: #0B5C50;
    --teal-tint: #E1F1EC;
    --red: #D5492E;
    --red-tint: #FBE6E0;
    --font-ui: "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    font-family: var(--font-ui);
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 10%, rgba(14,140,121,0.18), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(221,138,46,0.14), transparent 45%),
      linear-gradient(180deg, #0D1417 0%, #10171B 100%);
  }
  .panel {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border-radius: 16px;
    padding: 2.25rem 2rem 2rem;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55);
    animation: rise 0.4s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .panel { animation: none; } }

  .mark {
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(150deg, #17B39B, var(--teal-deep));
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 1.1rem;
    box-shadow: 0 6px 16px -6px rgba(14, 140, 121, 0.6);
  }
  .mark svg { width: 20px; height: 8px; color: #ECFBF7; }

  h1 { font-weight: 600; font-size: 1.3rem; margin: 0 0 0.3rem; letter-spacing: -0.015em; }
  .sub { color: var(--muted); font-size: 0.87rem; margin: 0 0 1.6rem; line-height: 1.5; }

  label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 0.4rem; }
  .pw-row { position: relative; }
  input[type="password"], input[type="text"] {
    width: 100%;
    font-family: var(--font-ui);
    font-size: 0.96rem;
    padding: 0.68rem 2.6rem 0.68rem 0.85rem;
    border: 1.5px solid var(--line);
    border-radius: 9px;
    background: #FAFBFA;
    color: var(--ink);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 3px var(--teal-tint);
  }
  .toggle-pw {
    position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 0.74rem; font-weight: 600; padding: 0.2rem 0.35rem;
  }
  .toggle-pw:hover { color: var(--ink-soft); }

  button.submit {
    width: 100%;
    margin-top: 1.25rem;
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 0.94rem;
    padding: 0.72rem 1rem;
    border-radius: 9px;
    border: none;
    background: var(--teal-deep);
    color: #F1FAF8;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
  }
  button.submit:hover { background: #094A40; }
  button.submit:active { transform: translateY(1px) scale(0.99); }
  button.submit:disabled { opacity: 0.6; cursor: default; }

  .error {
    display: none;
    margin-top: 0.9rem;
    font-size: 0.84rem;
    color: var(--red);
    background: var(--red-tint);
    border: 1px solid rgba(213,73,46,0.2);
    border-radius: 8px;
    padding: 0.55rem 0.75rem;
  }
  .error.is-visible { display: block; animation: shake 0.32s ease; }
  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }

  .footnote { margin-top: 1.5rem; font-size: 0.74rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <form class="panel" id="login-form" autocomplete="off">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 24" fill="none">
        <path d="M0 12 L10 12 L14 4 L20 20 L26 8 L30 16 L34 12 L64 12" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Mira Dataset Studio</h1>
    <p class="sub">This is an internal labeling tool. Enter the access password to continue.</p>

    <label for="password">Password</label>
    <div class="pw-row">
      <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" autofocus required />
      <button type="button" class="toggle-pw" id="toggle-pw">Show</button>
    </div>

    <button type="submit" class="submit" id="submit-btn">Continue</button>
    <p class="error" id="error-msg"></p>
    <p class="footnote">Access is restricted to authorized labelers.</p>
  </form>

<script>
  const form = document.getElementById("login-form");
  const pwInput = document.getElementById("password");
  const toggleBtn = document.getElementById("toggle-pw");
  const errorMsg = document.getElementById("error-msg");
  const submitBtn = document.getElementById("submit-btn");

  toggleBtn.addEventListener("click", () => {
    const showing = pwInput.type === "text";
    pwInput.type = showing ? "password" : "text";
    toggleBtn.textContent = showing ? "Show" : "Hide";
  });

  function showError(text) {
    errorMsg.textContent = text;
    errorMsg.classList.add("is-visible");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMsg.classList.remove("is-visible");
    submitBtn.disabled = true;
    submitBtn.textContent = "Checking…";

    // Trim accidental whitespace from paste/autofill — the most common
    // reason a correct-looking password gets rejected.
    const password = pwInput.value.trim();

    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "content-type": "application/json" },
        credentials: "same-origin",
        cache: "no-store",
        body: JSON.stringify({ password }),
      });

      if (res.ok) {
        const params = new URLSearchParams(window.location.search);
        const next = params.get("next") || "/";
        window.location.href = next;
        return;
      }

      if (res.status === 401) {
        showError("Incorrect password — please try again.");
      } else {
        // Something other than a bad password: a stale/misconfigured
        // deployment, missing Function, etc. Surface the status so it's
        // diagnosable instead of looking like a typo.
        showError(`Sign-in failed (server responded ${res.status}). The deployment may need attention.`);
      }
      pwInput.value = "";
      pwInput.focus();
    } catch (err) {
      showError("Couldn't reach the server. Check your connection and try again.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Continue";
    }
  });
</script>
</body>
</html>
